# XcodeGen spec. Generate the project with:  xcodegen generate
# Info.plist and .entitlements files are generated from the properties below.
name: NotificationToolkit

options:
  bundleIdPrefix: com.devmetal23
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  ToolkitCore:
    path: Packages/ToolkitCore

targets:
  NotificationToolkit:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: ToolkitCore
      - target: NotificationToolkitWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Notification Toolkit
        AppGroupIdentifier: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).retention
        NSFaceIDUsageDescription: Face ID keeps your notification history private.
    entitlements:
      path: Config/NotificationToolkit.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).notificationtoolkit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  NotificationToolkitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: ToolkitCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Notification Toolkit
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/NotificationToolkitWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).notificationtoolkit.widgets
        SKIP_INSTALL: YES

  # Throwaway app for validation spikes S1–S6 (docs/spikes.md). Not shipped.
  SpikeHarness:
    type: application
    platform: iOS
    sources:
      - path: SpikeHarness
    dependencies:
      - package: ToolkitCore
    info:
      path: SpikeHarness/Info.plist
      properties:
        CFBundleDisplayName: NT Spike
        AppGroupIdentifier: $(APP_GROUP_ID)
        UILaunchScreen: {}
    entitlements:
      path: Config/SpikeHarness.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        # S1 checks whether time-sensitive notifications break through Focus.
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).notificationtoolkit.spike

schemes:
  NotificationToolkit:
    build:
      targets:
        NotificationToolkit: all
        NotificationToolkitWidgets: all
    run:
      config: Debug
      storeKitConfiguration: Config/NotificationToolkit.storekit
    archive:
      config: Release
  SpikeHarness:
    build:
      targets:
        SpikeHarness: all
    run:
      config: Debug
